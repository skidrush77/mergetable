<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍹 음료 합치기 게임</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(180deg, #3a9cc8 0%, #1e7aaa 40%, #1460a0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .deco { position:fixed; font-size:90px; bottom:0; opacity:0.12; pointer-events:none; }
    .deco-l { left:-5px;  transform:rotate(-8deg); }
    .deco-r { right:-5px; transform:scaleX(-1) rotate(-8deg); }

    #ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* ── Score bar ── */
    #top-bar { display:flex; gap:14px; }
    .panel {
      background: rgba(60,30,10,0.75);
      border: 1px solid rgba(200,140,60,0.35);
      border-radius: 13px;
      padding: 5px 20px;
      text-align: center;
      min-width: 105px;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,200,100,0.1);
    }
    .panel .lbl { font-size:10px; letter-spacing:2px; color:rgba(220,170,90,0.7); text-transform:uppercase; }
    .panel .val { font-size:23px; font-weight:700; color:#f0c060; text-shadow:0 0 10px rgba(240,192,96,0.4); }

    /* ── Canvas wrapper ── */
    #wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 0 3px #3a1e08, 0 0 0 5px #6b3f1a, 0 12px 40px rgba(0,0,0,0.6), 0 2px 0 rgba(255,200,100,0.15) inset;
    }
    canvas { display:block; cursor:none; }

    /* ── Overlay ── */
    #overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(20,10,4,0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      gap: 12px;
    }
    #overlay.show { display:flex; }
    #overlay .big { font-size:68px; animation:pop .5s ease; }
    #overlay h2 {
      font-size:36px; letter-spacing:3px;
      background:linear-gradient(90deg,#f093fb,#f5576c);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    #overlay .sub { font-size:13px; color:rgba(255,255,255,0.45); letter-spacing:1px; }
    #final { font-size:20px; color:#ffd700; }
    #btn {
      margin-top:6px; padding:13px 38px; font-size:16px; font-weight:600; letter-spacing:1px;
      background:linear-gradient(135deg,#f093fb,#f5576c); border:none; border-radius:50px;
      color:white; cursor:pointer;
      box-shadow:0 4px 22px rgba(245,87,108,0.4);
      transition:transform .14s, box-shadow .14s;
    }
    #btn:hover { transform:scale(1.07); box-shadow:0 6px 28px rgba(245,87,108,0.6); }

    /* ── Next + legend ── */
    #next-bar {
      display:flex; align-items:center; gap:12px;
      background:rgba(60,30,10,0.75); border:1px solid rgba(200,140,60,0.3);
      border-radius:13px; padding:7px 22px; color:white; backdrop-filter:blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #next-bar .lbl { font-size:11px; color:rgba(220,170,90,0.7); letter-spacing:2px; text-transform:uppercase; }
    #next-emoji { font-size:40px; line-height:1; }
    #legend { display:flex; gap:5px; opacity:.5; }
    .tdot {
      width:26px; height:26px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:14px; border:1px solid rgba(255,255,255,0.12);
    }
    @keyframes pop { 0%{transform:scale(.4);opacity:0} 65%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
  </style>
</head>
<body>
<div class="deco deco-l">🌴</div>
<div class="deco deco-r">🌴</div>

<div id="ui">
  <div id="top-bar">
    <div class="panel"><div class="lbl">SCORE</div><div class="val" id="sv">0</div></div>
    <div class="panel"><div class="lbl">BEST</div><div class="val"  id="bv">0</div></div>
  </div>

  <div id="wrap">
    <canvas id="c" width="460" height="700"></canvas>
    <div id="overlay">
      <div class="big">🥴</div>
      <h2>GAME OVER</h2>
      <div class="sub">아이템이 발사선까지 쌓였어요!</div>
      <div id="final">최종 점수: 0</div>
      <button id="btn">🍹 다시 시작</button>
    </div>
  </div>

  <div id="next-bar">
    <span class="lbl">NEXT</span>
    <span id="next-emoji">🧃</span>
  </div>
  <div id="legend"></div>
</div>

<script>
/* ╔══════════════════════════════════════════════════════╗
   ║  DRINK MERGE GAME  —  Inverted Suika Style          ║
   ║  • No gravity  • Items shot upward from bottom      ║
   ║  • Bounce L/R walls  • Freeze on ceiling/item hit   ║
   ║  • Same-tier collision → merge → upgrade            ║
   ╚══════════════════════════════════════════════════════╝ */

const { Engine, Bodies, Body, World, Events, Vector } = Matter;

/* ── Layout ─────────────────────────────────────────── */
const CW = 460, CH = 700;          // canvas
const WALL_T   = 22;               // wall thickness
const CEIL_Y   = 50;               // ceiling top-edge Y
const PLAY_L   = WALL_T;           // left inner edge  x = 22
const PLAY_R   = CW - WALL_T;      // right inner edge x = 438
const PLAY_W   = PLAY_R - PLAY_L;  // 416
const DANGER_Y = 620;              // game-over line
const LAUNCH_Y = 655;              // launcher centre Y (below danger)
const LAUNCH_X = CW / 2;          // launcher centre X

/* ── Item config ─────────────────────────────────────── */
const ITEMS = [
  { e:'🧃', r:17, score:1,  col:'#ff9a3c', bg:'rgba(255,154,60,.55)'  },
  { e:'🥤', r:23, score:3,  col:'#4fc3f7', bg:'rgba(79,195,247,.55)'  },
  { e:'🍹', r:29, score:6,  col:'#f48fb1', bg:'rgba(244,143,177,.55)' },
  { e:'🧋', r:36, score:10, col:'#ce93d8', bg:'rgba(206,147,216,.55)' },
  { e:'🍺', r:43, score:15, col:'#ffcc02', bg:'rgba(255,204,2,.55)'   },
  { e:'🍷', r:50, score:21, col:'#e53935', bg:'rgba(229,57,53,.55)'   },
  { e:'🥂', r:57, score:28, col:'#ffd700', bg:'rgba(255,215,0,.55)'   },
  { e:'🍾', r:64, score:36, col:'#26c6da', bg:'rgba(38,198,218,.55)'  },
];

/* ── State ───────────────────────────────────────────── */
let engine, world;
let items   = [];   // {body, tier, frozen, merging, born}
let effects = [];   // burst particles
let curTier, nextTier;
let score, best;
let gameOver, canShoot;
let mx = LAUNCH_X, my = LAUNCH_Y - 80;
let pendingMerges = new Set();
let frame = 0;

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

/* ── Cloud helper (drawn in drawBg) ─────────────────── */
function drawCloud(x, y, s) {
  ctx.save();
  ctx.globalAlpha = 0.72 * s;
  ctx.fillStyle = '#e8f6ff';
  ctx.beginPath();
  ctx.arc(x,          y,          13*s, 0, Math.PI*2);
  ctx.arc(x + 18*s,   y - 5*s,    17*s, 0, Math.PI*2);
  ctx.arc(x + 36*s,   y,          11*s, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* roundRect polyfill */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.beginPath();
    this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r); this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r); this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r); this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r); this.closePath(); return this;
  };
}

/* ╔══════════════════════════════════════════════════════╗
   ║  PHYSICS SETUP                                      ║
   ╚══════════════════════════════════════════════════════╝ */
function setupPhysics() {
  engine = Engine.create({ gravity:{ x:0, y:0 } });   // NO GRAVITY
  world  = engine.world;

  const wallOpts = (label) => ({
    isStatic:true, label,
    restitution:0.60, friction:0.04, frictionStatic:0.04,
  });
  const ceilOpts = {
    isStatic:true, label:'ceiling',
    restitution:0.08, friction:0.6, frictionStatic:0.8,
  };

  // Left wall, right wall, ceiling
  const lw = Bodies.rectangle(WALL_T/2,     CH/2, WALL_T,   CH*2,  wallOpts('lwall'));
  const rw = Bodies.rectangle(CW-WALL_T/2,  CH/2, WALL_T,   CH*2,  wallOpts('rwall'));
  const tw = Bodies.rectangle(CW/2,         CEIL_Y - WALL_T/2, CW*2, WALL_T, ceilOpts);
  World.add(world, [lw, rw, tw]);

  Events.on(engine, 'collisionStart', onCollision);
}

/* ╔══════════════════════════════════════════════════════╗
   ║  GAME INIT                                          ║
   ╚══════════════════════════════════════════════════════╝ */
function initGame() {
  if (engine) { World.clear(world); Engine.clear(engine); }
  items         = [];
  effects       = [];
  pendingMerges = new Set();
  score = 0;
  best  = parseInt(localStorage.getItem('drinkMergeB2') || '0');
  gameOver = false;
  canShoot = true;

  setupPhysics();
  curTier  = rndTier();
  nextTier = rndTier();
  updateUI();
  document.getElementById('next-emoji').textContent = ITEMS[nextTier].e;
  document.getElementById('overlay').classList.remove('show');
}

function rndTier() {
  const w=[.38,.28,.20,.14]; let r=Math.random(),c=0;
  for (let i=0;i<w.length;i++){c+=w[i];if(r<c)return i;}
  return 0;
}

/* ╔══════════════════════════════════════════════════════╗
   ║  SHOOTING                                           ║
   ╚══════════════════════════════════════════════════════╝ */
function shoot(tx, ty) {
  if (!canShoot || gameOver) return;

  const dx = tx - LAUNCH_X;
  const dy = ty - LAUNCH_Y;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len < 5) return;

  // Clamp direction: allow shooting mostly upward (dy < 0)
  // If clicking below launcher, redirect straight up
  let nx = dx/len;
  let ny = dy/len;
  if (ny > -0.2) { nx = (dx >= 0 ? 1 : -1) * Math.sin(Math.PI/4); ny = -Math.cos(Math.PI/4); }

  const info = ITEMS[curTier];
  const startY = DANGER_Y - info.r - 4;  // just above danger line

  const body = Bodies.circle(LAUNCH_X, startY, info.r, {
    restitution: 0.50,
    friction:    0.04,
    frictionAir: 0.018,    // gradual decel → items slow & stop naturally
    density:     0.002,
    label:       'item',
    collisionFilter: { category:0x0001, mask:0xFFFF },
  });

  const spd = 14;
  Body.setVelocity(body, { x: nx * spd, y: ny * spd });
  World.add(world, body);
  items.push({ body, tier:curTier, settled:false, merging:false, born:Date.now() });

  curTier  = nextTier;
  nextTier = rndTier();
  document.getElementById('next-emoji').textContent = ITEMS[nextTier].e;

  canShoot = false;
  setTimeout(()=>{ if (!gameOver) canShoot=true; }, 600);
}

/* ╔══════════════════════════════════════════════════════╗
   ║  SETTLE  (stop velocity but keep dynamic = curling) ║
   ╚══════════════════════════════════════════════════════╝ */
function settleItem(item) {
  if (!item || item.merging) return;
  item.settled = true;
  Body.setVelocity(item.body, {x:0, y:0});
  Body.setAngularVelocity(item.body, 0);
  // NOTE: body stays dynamic (isStatic:false) so it can be pushed/curled
}

/* ╔══════════════════════════════════════════════════════╗
   ║  COLLISION HANDLER                                  ║
   ╚══════════════════════════════════════════════════════╝ */
function onCollision(evt) {
  evt.pairs.forEach(({ bodyA, bodyB }) => {
    const a  = items.find(i => i.body === bodyA);
    const b  = items.find(i => i.body === bodyB);
    const la = bodyA.label;
    const lb = bodyB.label;

    /* ── Item hits ceiling: absorb energy, let frictionAir do the rest ── */
    if (a && lb === 'ceiling') {
      const v = a.body.velocity;
      Body.setVelocity(a.body, { x: v.x * 0.35, y: v.y * 0.04 });
      a.settled = false;
      return;
    }
    if (b && la === 'ceiling') {
      const v = b.body.velocity;
      Body.setVelocity(b.body, { x: v.x * 0.35, y: v.y * 0.04 });
      b.settled = false;
      return;
    }

    /* ── Left/right walls: physics handles bounce naturally ── */
    if (la === 'lwall' || la === 'rwall' || lb === 'lwall' || lb === 'rwall') return;

    /* ── Two items collide ── */
    if (!a || !b) return;

    // Wake up settled items that get hit (curling effect!)
    if (a.settled) a.settled = false;
    if (b.settled) b.settled = false;

    // Same tier → merge
    if (!a.merging && !b.merging && a.tier === b.tier && a.tier < ITEMS.length-1) {
      const key = [bodyA.id, bodyB.id].sort().join(',');
      if (!pendingMerges.has(key)) {
        pendingMerges.add(key);
        a.merging = b.merging = true;
        setTimeout(() => doMerge(a, b), 60);
      }
    }
    // Different tier: Matter.js restitution(0.5) naturally transfers momentum — curling!
  });
}

/* ── Slow-moving item settle (zero vel, stay dynamic) ── */
function checkSlowItems() {
  const now = Date.now();
  items.forEach(it => {
    if (it.merging) return;
    if (now - it.born < 500) return;   // grace: just launched/merged
    const v  = it.body.velocity;
    const sp = Math.sqrt(v.x*v.x + v.y*v.y);
    if (sp < 0.18 && !it.settled) {
      settleItem(it);
    } else if (sp > 0.5) {
      it.settled = false;  // moving again (was pushed)
    }
  });
}

/* ╔══════════════════════════════════════════════════════╗
   ║  MERGE                                              ║
   ╚══════════════════════════════════════════════════════╝ */
function doMerge(a, b) {
  if (!items.includes(a) || !items.includes(b)) return;

  const mx2 = (a.body.position.x + b.body.position.x) / 2;
  const my2 = (a.body.position.y + b.body.position.y) / 2;
  const nt   = a.tier + 1;
  const info = ITEMS[nt];

  World.remove(world, a.body);
  World.remove(world, b.body);
  items = items.filter(i => i !== a && i !== b);

  const nb = Bodies.circle(mx2, my2, info.r, {
    isStatic:    false,   // dynamic — can be pushed (curling!)
    label:       'item',
    restitution: 0.50,
    friction:    0.04,
    frictionAir: 0.018,
    density:     0.002,
    collisionFilter: { category:0x0001, mask:0xFFFF },
  });
  // Give tiny upward nudge so it settles against neighbours naturally
  Body.setVelocity(nb, { x:0, y:-1.5 });
  World.add(world, nb);
  items.push({ body:nb, tier:nt, settled:false, merging:false, born:Date.now() });

  score += info.score;
  if (score > best) { best = score; localStorage.setItem('drinkMergeB2', best); }
  updateUI();
  spawnBurst(mx2, my2, info.col);
}

/* ╔══════════════════════════════════════════════════════╗
   ║  PARTICLES                                          ║
   ╚══════════════════════════════════════════════════════╝ */
function spawnBurst(x, y, col) {
  for (let i=0;i<16;i++) {
    const a = (i/16)*Math.PI*2;
    const s = Math.random()*4+2;
    effects.push({ x, y, col, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
                   r:Math.random()*4+2, life:1 });
  }
}
function stepEffects() {
  effects = effects.filter(e=>e.life>0);
  effects.forEach(e=>{
    e.x+=e.vx; e.y+=e.vy; e.vx*=.91; e.vy*=.91; e.life-=.036;
  });
}

/* ╔══════════════════════════════════════════════════════╗
   ║  GAME OVER CHECK                                    ║
   ╚══════════════════════════════════════════════════════╝ */
function checkGameOver() {
  for (const it of items) {
    if (it.merging) continue;
    // Any item (settled or moving) whose bottom crosses the danger line = game over
    if (it.body.position.y + ITEMS[it.tier].r > DANGER_Y) {
      endGame(); return;
    }
  }
}

function endGame() {
  if (gameOver) return;
  gameOver = canShoot = false;
  document.getElementById('final').textContent = `최종 점수: ${score}`;
  document.getElementById('overlay').classList.add('show');
}

/* ╔══════════════════════════════════════════════════════╗
   ║  DRAWING                                            ║
   ╚══════════════════════════════════════════════════════╝ */
function drawBg() {
  /* ════ BEACH BACKGROUND — fills entire canvas ════ */

  /* Sky gradient — top of canvas down past the table ceiling */
  const sky = ctx.createLinearGradient(0, 0, 0, CH * 0.54);
  sky.addColorStop(0,    '#1e6fa8');
  sky.addColorStop(0.3,  '#3a96c4');
  sky.addColorStop(0.7,  '#60b8d8');
  sky.addColorStop(1,    '#90d4ea');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CW, CH * 0.54);

  /* Ocean gradient — lower half (visible below table) */
  const oc = ctx.createLinearGradient(0, CH * 0.52, 0, CH);
  oc.addColorStop(0,    '#0a5e8c');
  oc.addColorStop(0.25, '#1278a8');
  oc.addColorStop(0.6,  '#2090c0');
  oc.addColorStop(1,    '#44aed4');
  ctx.fillStyle = oc;
  ctx.fillRect(0, CH * 0.52, CW, CH);

  /* Horizon glow stripe */
  const hg = ctx.createLinearGradient(0, CH*0.50, 0, CH*0.57);
  hg.addColorStop(0,   'rgba(255,220,140,0.0)');
  hg.addColorStop(0.45,'rgba(255,210,120,0.32)');
  hg.addColorStop(1,   'rgba(20,100,160,0.0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, CH*0.50, CW, CH*0.07);

  /* Sun — upper-right, mostly in the sky band above the table */
  const sunX = CW * 0.82, sunY = 30;
  /* Rays */
  for (let i = 0; i < 10; i++) {
    const a = (i/10)*Math.PI*2;
    ctx.strokeStyle = 'rgba(255,235,110,0.18)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sunX + Math.cos(a)*22, sunY + Math.sin(a)*22);
    ctx.lineTo(sunX + Math.cos(a)*42, sunY + Math.sin(a)*42);
    ctx.stroke();
  }
  /* Disc */
  const sdg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 22);
  sdg.addColorStop(0,    '#fffce0');
  sdg.addColorStop(0.45, '#ffd740');
  sdg.addColorStop(0.85, '#ffaa00');
  sdg.addColorStop(1,    'transparent');
  ctx.fillStyle = sdg;
  ctx.beginPath(); ctx.arc(sunX, sunY, 22, 0, Math.PI*2); ctx.fill();

  /* Clouds — clipped to sky area so they don't show over table */
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, CW, CEIL_Y); ctx.clip();
  drawCloud(28,  30, 0.75);
  drawCloud(155, 18, 0.55);
  drawCloud(310, 34, 0.65);
  ctx.restore();

  /* Ocean sparkles — visible at bottom below table legs */
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  [[48,668],[138,684],[228,670],[318,682],[400,660]].forEach(([sx,sy])=>{
    ctx.save(); ctx.translate(sx,sy); ctx.scale(3.2, 0.7);
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function drawWalls() {
  const FACE_H = 24;   // table front-face height (3D edge)
  const LEG_W  = 22;   // leg width
  const LEG_H  = 52;   // leg height
  const legTop = DANGER_Y + FACE_H;

  /* ════ LEFT / RIGHT WOODEN BORDER WALLS ════ */
  const lwg = ctx.createLinearGradient(0, 0, WALL_T, 0);
  lwg.addColorStop(0,   '#3a1a05');
  lwg.addColorStop(0.55,'#7a4415');
  lwg.addColorStop(1,   '#9e5c20');
  ctx.fillStyle = lwg;
  ctx.fillRect(0, CEIL_Y, WALL_T, DANGER_Y - CEIL_Y);

  const rwg = ctx.createLinearGradient(PLAY_R, 0, CW, 0);
  rwg.addColorStop(0,   '#9e5c20');
  rwg.addColorStop(0.45,'#7a4415');
  rwg.addColorStop(1,   '#3a1a05');
  ctx.fillStyle = rwg;
  ctx.fillRect(PLAY_R, CEIL_Y, WALL_T, DANGER_Y - CEIL_Y);

  /* ════ TOP BORDER — back edge of table, semi-transparent to show sky ════ */
  const tbg = ctx.createLinearGradient(0, 0, 0, CEIL_Y);
  tbg.addColorStop(0,   'rgba(30,12,3,0.15)');
  tbg.addColorStop(0.5, 'rgba(70,35,10,0.6)');
  tbg.addColorStop(1,   '#8a5018');
  ctx.fillStyle = tbg;
  ctx.fillRect(0, 0, CW, CEIL_Y);

  /* ════ TABLE SURFACE — trapezoid perspective effect ════
     Drawn as a rectangle but with converging perspective lines */
  const surf = ctx.createLinearGradient(0, CEIL_Y, 0, DANGER_Y);
  surf.addColorStop(0,    '#c0a870');   // darker / farther
  surf.addColorStop(0.18, '#d4bc84');
  surf.addColorStop(0.45, '#e8cf98');
  surf.addColorStop(0.75, '#f2dda8');
  surf.addColorStop(1,    '#faecc0');   // brighter / closer
  ctx.fillStyle = surf;
  ctx.fillRect(PLAY_L, CEIL_Y, PLAY_W, DANGER_Y - CEIL_Y);

  /* Perspective grid lines on the surface */
  ctx.save();
  ctx.beginPath(); ctx.rect(PLAY_L, CEIL_Y, PLAY_W, DANGER_Y - CEIL_Y); ctx.clip();

  // Horizontal lines — converge (get closer together) towards the top
  for (let i = 0; i <= 11; i++) {
    const t   = i / 11;
    const y   = CEIL_Y + t * (DANGER_Y - CEIL_Y);
    const ins = (1 - t) * 24;     // lines inset more at the top
    ctx.strokeStyle = `rgba(140,100,40,${0.055 + t * 0.045})`;
    ctx.lineWidth = 0.85;
    ctx.beginPath();
    ctx.moveTo(PLAY_L + ins, y);
    ctx.lineTo(PLAY_R - ins, y);
    ctx.stroke();
  }
  // Vertical lines — converge toward a vanishing point at top-centre
  for (let i = 0; i <= 7; i++) {
    const t    = i / 7;
    const xTop = PLAY_L + 28 + t * (PLAY_W - 56);  // compressed range at top
    const xBot = PLAY_L + t * PLAY_W;
    ctx.strokeStyle = 'rgba(140,100,40,0.055)';
    ctx.lineWidth = 0.85;
    ctx.beginPath(); ctx.moveTo(xTop, CEIL_Y); ctx.lineTo(xBot, DANGER_Y); ctx.stroke();
  }
  ctx.restore();

  /* ── Inner edge bevels (bright rim of the table top) ── */
  ctx.strokeStyle = 'rgba(215,170,80,0.70)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(PLAY_L, CEIL_Y);   ctx.lineTo(PLAY_L, DANGER_Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PLAY_R, CEIL_Y);   ctx.lineTo(PLAY_R, DANGER_Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PLAY_L, CEIL_Y);   ctx.lineTo(PLAY_R, CEIL_Y);   ctx.stroke();

  /* ── Inner shadows along edges (depth) ── */
  const lsh = ctx.createLinearGradient(PLAY_L, 0, PLAY_L+20, 0);
  lsh.addColorStop(0,'rgba(0,0,0,0.22)'); lsh.addColorStop(1,'transparent');
  ctx.fillStyle = lsh; ctx.fillRect(PLAY_L, CEIL_Y, 20, DANGER_Y - CEIL_Y);

  const rsh = ctx.createLinearGradient(PLAY_R-20, 0, PLAY_R, 0);
  rsh.addColorStop(0,'transparent'); rsh.addColorStop(1,'rgba(0,0,0,0.22)');
  ctx.fillStyle = rsh; ctx.fillRect(PLAY_R-20, CEIL_Y, 20, DANGER_Y - CEIL_Y);

  const tsh = ctx.createLinearGradient(0, CEIL_Y, 0, CEIL_Y+24);
  tsh.addColorStop(0,'rgba(0,0,0,0.28)'); tsh.addColorStop(1,'transparent');
  ctx.fillStyle = tsh; ctx.fillRect(PLAY_L, CEIL_Y, PLAY_W, 24);

  /* ════ TABLE FRONT FACE — 3D visible edge below danger line ════ */
  const ffg = ctx.createLinearGradient(0, DANGER_Y, 0, DANGER_Y + FACE_H);
  ffg.addColorStop(0,    '#c07820');
  ffg.addColorStop(0.45, '#9a5c14');
  ffg.addColorStop(1,    '#4e2c06');
  ctx.fillStyle = ffg;
  ctx.fillRect(PLAY_L - 2, DANGER_Y, PLAY_W + 4, FACE_H);

  /* Top lip highlight */
  const lip = ctx.createLinearGradient(0, DANGER_Y, 0, DANGER_Y + 4);
  lip.addColorStop(0, 'rgba(255,215,100,0.6)');
  lip.addColorStop(1, 'transparent');
  ctx.fillStyle = lip; ctx.fillRect(PLAY_L - 2, DANGER_Y, PLAY_W + 4, 4);

  /* Bottom shadow of front face */
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.fillRect(PLAY_L - 2, DANGER_Y + FACE_H - 2.5, PLAY_W + 4, 2.5);

  /* ════ TABLE LEGS ════ */
  const legPositions = [PLAY_L + 10, PLAY_R - 10 - LEG_W];
  legPositions.forEach(lx => {
    /* Leg body */
    const lg = ctx.createLinearGradient(lx, 0, lx + LEG_W, 0);
    lg.addColorStop(0,    '#321604');
    lg.addColorStop(0.35, '#7a4010');
    lg.addColorStop(0.65, '#9c5818');
    lg.addColorStop(1,    '#5e3008');
    ctx.fillStyle = lg;
    ctx.fillRect(lx, legTop, LEG_W, LEG_H);

    /* Leg highlight strip */
    ctx.fillStyle = 'rgba(255,185,80,0.18)';
    ctx.fillRect(lx + 4, legTop + 3, 4, LEG_H - 6);

    /* Foot base */
    ctx.fillStyle = '#241004';
    ctx.fillRect(lx - 4, legTop + LEG_H, LEG_W + 8, 9);

    /* Foot ground shadow */
    const fsh = ctx.createRadialGradient(lx + LEG_W/2, legTop + LEG_H + 9, 1,
                                          lx + LEG_W/2, legTop + LEG_H + 9, 18);
    fsh.addColorStop(0, 'rgba(0,0,0,0.35)');
    fsh.addColorStop(1, 'transparent');
    ctx.fillStyle = fsh;
    ctx.beginPath();
    ctx.ellipse(lx + LEG_W/2, legTop + LEG_H + 12, 18, 5, 0, 0, Math.PI*2);
    ctx.fill();
  });

  /* ════ TITLE on top border ════ */
  ctx.globalAlpha = 0.50;
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe0a0';
  ctx.fillText('🍹  DRINK MERGE  🍹', CW/2, CEIL_Y * 0.52);
  ctx.globalAlpha = 1;
}

function drawDangerLine() {
  ctx.save();
  ctx.strokeStyle='rgba(255,60,40,.6)'; ctx.lineWidth=2; ctx.setLineDash([10,6]);
  ctx.beginPath(); ctx.moveTo(PLAY_L,DANGER_Y); ctx.lineTo(PLAY_R,DANGER_Y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,70,40,.5)'; ctx.font='bold 9px sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.letterSpacing='1px';
  ctx.fillText('DANGER', PLAY_L+8, DANGER_Y-3);
  ctx.restore();
}

function drawItems() {
  /* Draw shadows first (top-view: shadow = slightly offset dark ellipse) */
  items.forEach(({ body, tier }) => {
    const {x,y} = body.position;
    const info   = ITEMS[tier];
    const sr = info.r;
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle   = '#1a0800';
    ctx.beginPath();
    ctx.ellipse(x+5, y+5, sr*1.05, sr*0.88, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  /* Draw items */
  items.forEach(({ body, tier, settled }) => {
    const {x,y} = body.position;
    const ang    = body.angle;
    const info   = ITEMS[tier];

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);

    /* Base circle — solid colour, top-view cup/bottle look */
    ctx.fillStyle   = info.col;
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth   = 1.8;
    ctx.beginPath(); ctx.arc(0, 0, info.r, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    /* Rim ring (top of cup, seen from above) */
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth   = info.r * 0.18;
    ctx.beginPath(); ctx.arc(0, 0, info.r * 0.78, 0, Math.PI*2); ctx.stroke();

    /* Overhead light specular (top-left bright spot) */
    const hl = ctx.createRadialGradient(-info.r*.3, -info.r*.32, 0, -info.r*.1, -info.r*.1, info.r*.75);
    hl.addColorStop(0,   'rgba(255,255,255,0.55)');
    hl.addColorStop(0.4, 'rgba(255,255,255,0.12)');
    hl.addColorStop(1,   'transparent');
    ctx.fillStyle = hl;
    ctx.beginPath(); ctx.arc(0, 0, info.r, 0, Math.PI*2); ctx.fill();

    /* Edge darkening */
    const edge = ctx.createRadialGradient(0, 0, info.r*0.6, 0, 0, info.r);
    edge.addColorStop(0,   'transparent');
    edge.addColorStop(1,   'rgba(0,0,0,0.25)');
    ctx.fillStyle = edge;
    ctx.beginPath(); ctx.arc(0, 0, info.r, 0, Math.PI*2); ctx.fill();

    /* Emoji */
    ctx.font = `${info.r * 1.05}px serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(info.e, 0, 1);

    ctx.restore();
  });
}

function drawEffects() {
  effects.forEach(e=>{
    ctx.globalAlpha=e.life*.88;
    ctx.fillStyle=e.col;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawLauncher() {
  if (gameOver) return;

  const info = ITEMS[curTier];

  /* ── Aiming line ── */
  const dx = mx - LAUNCH_X, dy = my - LAUNCH_Y;
  const len = Math.sqrt(dx*dx+dy*dy);
  if (len > 10) {
    let nx=dx/len, ny=dy/len;
    if (ny > -0.15) { ny=-0.98; nx=(dx>=0?.2:-.2); }  // clamp upward

    // Aim line length: from danger line up to (near) ceiling
    const aimLen = DANGER_Y - CEIL_Y - 10;  // ~560px — full play height

    ctx.save();

    /* Faded tail section */
    const fadeGrad = ctx.createLinearGradient(
      LAUNCH_X, DANGER_Y-2,
      LAUNCH_X + nx*aimLen, DANGER_Y-2 + ny*aimLen
    );
    fadeGrad.addColorStop(0,   'rgba(255,230,80,0.55)');
    fadeGrad.addColorStop(0.55,'rgba(255,230,80,0.30)');
    fadeGrad.addColorStop(1,   'rgba(255,230,80,0.08)');

    ctx.strokeStyle = fadeGrad;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([12,10]);
    ctx.beginPath();
    ctx.moveTo(LAUNCH_X, DANGER_Y-2);
    ctx.lineTo(LAUNCH_X + nx*aimLen, DANGER_Y-2 + ny*aimLen);
    ctx.stroke();
    ctx.setLineDash([]);

    /* Mid arrowhead (halfway) */
    const midX = LAUNCH_X + nx*aimLen*0.52, midY = DANGER_Y-2 + ny*aimLen*0.52;
    const angM = Math.atan2(ny, nx);
    ctx.fillStyle = 'rgba(255,230,80,0.35)';
    ctx.beginPath();
    ctx.moveTo(midX, midY);
    ctx.lineTo(midX - Math.cos(angM-.32)*16, midY - Math.sin(angM-.32)*16);
    ctx.lineTo(midX - Math.cos(angM+.32)*16, midY - Math.sin(angM+.32)*16);
    ctx.closePath(); ctx.fill();

    /* Tip arrowhead — large & bright */
    const ex = LAUNCH_X + nx*aimLen, ey = DANGER_Y-2 + ny*aimLen;
    const ang = Math.atan2(ny, nx);
    ctx.fillStyle = 'rgba(255,240,100,0.80)';
    ctx.strokeStyle = 'rgba(255,200,40,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - Math.cos(ang-.42)*26, ey - Math.sin(ang-.42)*26);
    ctx.lineTo(ex - Math.cos(ang+.42)*26, ey - Math.sin(ang+.42)*26);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.restore();
  }

  /* ── Item on launcher ── */
  const pulse = .93+.07*Math.sin(frame*.11);
  const pr = (info.r+5)*pulse;

  const rg=ctx.createRadialGradient(LAUNCH_X,LAUNCH_Y,0,LAUNCH_X,LAUNCH_Y,pr*1.7);
  rg.addColorStop(0,info.col+'3a'); rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(LAUNCH_X,LAUNCH_Y,pr*1.7,0,Math.PI*2); ctx.fill();

  ctx.fillStyle=info.bg; ctx.strokeStyle=info.col; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(LAUNCH_X,LAUNCH_Y,pr,0,Math.PI*2); ctx.fill(); ctx.stroke();

  ctx.font=`${info.r*1.18}px serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(info.e, LAUNCH_X, LAUNCH_Y+1);

  /* Launcher base */
  ctx.fillStyle='#4a2610';
  ctx.beginPath();
  ctx.roundRect(LAUNCH_X-36, LAUNCH_Y+pr+4, 72, 16, 6);
  ctx.fill();
  ctx.fillStyle='rgba(255,190,70,.22)';
  ctx.beginPath();
  ctx.roundRect(LAUNCH_X-28, LAUNCH_Y+pr+7, 56, 5, 3);
  ctx.fill();
}

function drawCursor() {
  if (gameOver) return;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.5;
  const s=9;
  ctx.beginPath();
  ctx.moveTo(mx-s,my); ctx.lineTo(mx+s,my);
  ctx.moveTo(mx,my-s); ctx.lineTo(mx,my+s);
  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(mx,my,5,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

/* ╔══════════════════════════════════════════════════════╗
   ║  MAIN LOOP                                          ║
   ╚══════════════════════════════════════════════════════╝ */
let lastTS = 0;
function loop(ts) {
  const dt = Math.min(ts-lastTS, 50); lastTS=ts; frame++;

  if (!gameOver) {
    Engine.update(engine, dt||16.67);
    stepEffects();
    checkSlowItems();
    checkGameOver();
  }

  ctx.clearRect(0,0,CW,CH);
  drawBg();
  drawWalls();
  drawDangerLine();
  drawItems();
  drawEffects();
  drawLauncher();
  drawCursor();

  requestAnimationFrame(loop);
}

/* ╔══════════════════════════════════════════════════════╗
   ║  UI                                                 ║
   ╚══════════════════════════════════════════════════════╝ */
function updateUI() {
  document.getElementById('sv').textContent = score;
  document.getElementById('bv').textContent = best;
}

/* Legend */
(()=>{
  const leg=document.getElementById('legend');
  ITEMS.forEach(it=>{
    const d=document.createElement('div');
    d.className='tdot';
    d.style.background=it.bg; d.style.borderColor=it.col;
    d.textContent=it.e; d.title=`+${it.score}점`;
    leg.appendChild(d);
  });
})();

/* ╔══════════════════════════════════════════════════════╗
   ║  EVENTS                                             ║
   ╚══════════════════════════════════════════════════════╝ */
function canvasPos(cx, cy) {
  const r=canvas.getBoundingClientRect();
  return { x:(cx-r.left)*(CW/r.width), y:(cy-r.top)*(CH/r.height) };
}
canvas.addEventListener('mousemove', e=>{
  const p=canvasPos(e.clientX,e.clientY); mx=p.x; my=p.y;
});
canvas.addEventListener('click', e=>{
  const p=canvasPos(e.clientX,e.clientY); shoot(p.x,p.y);
});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  const p=canvasPos(e.touches[0].clientX,e.touches[0].clientY); mx=p.x; my=p.y;
},{passive:false});
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const p=canvasPos(e.touches[0].clientX,e.touches[0].clientY);
  mx=p.x; my=p.y; shoot(p.x,p.y);
},{passive:false});
document.getElementById('btn').addEventListener('click', initGame);

/* ╔══════════════════════════════════════════════════════╗
   ║  START                                              ║
   ╚══════════════════════════════════════════════════════╝ */
initGame();
requestAnimationFrame(loop);
</script>
